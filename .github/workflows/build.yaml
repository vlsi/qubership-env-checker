name: Build Artifacts
on:
  release:
    types: [created]
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      postfix:
        description: 'Postfix for tag name'
        required: false

env:
  RAW_TAG_NAME: ${{ github.event.release.tag_name != '' && github.event.release.tag_name || github.ref_name }}
  TAG_POSTFIX: ${{ inputs.postfix || '' }}

jobs:
  multiplatform_build:
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: qubership-env-checker
            file: Dockerfile
            context: .
    runs-on: ubuntu-latest
    permissions:
      contents: write          # submit dependency snapshot
      security-events: write   # upload SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${GITHUB_ACTOR}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Compute image tag
        id: tag
        run: |
          NAME="${RAW_TAG_NAME}"
          # sanitize to be a valid docker tag: lowercase, replace invalid chars, max length 128
          NAME="${NAME,,}"
          NAME=$(echo "$NAME" | sed -E 's/[^a-z0-9._-]+/-/g')
          # optional postfix
          if [ -n "${TAG_POSTFIX}" ]; then
            POSTFIX=$(echo "${TAG_POSTFIX}" | sed -E 's/[^a-z0-9._-]+/-/g')
            NAME="${NAME}-${POSTFIX}"
          fi
          echo "tag=$NAME" >> $GITHUB_OUTPUT
      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v6
        with:
          no-cache: true
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.file }}
          platforms: linux/amd64
          push: ${{ github.repository_owner == 'Netcracker' }}
          tags: ghcr.io/netcracker/${{ matrix.component.name }}:${{ steps.tag.outputs.tag }}
          provenance: false

      - name: Generate & submit SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/netcracker/${{ matrix.component.name }}:${{ steps.tag.outputs.tag }}
          dependency-snapshot: true # <-- pushes to GitHub Dependency Graph
          artifact-name: sbom.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # --- Vulnerability scan #1: Trivy (upload SARIF to Security tab) ---
      - name: Trivy scan (image → SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/netcracker/${{ matrix.component.name }}:${{ steps.tag.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: 'os,library'
          ignore-unfixed: false

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # --- Vulnerability scan #2: Grype (different matcher/db) ---
      - name: Grype scan (image → SARIF)
        uses: anchore/scan-action@v6
        id: grype
        with:
          image: ghcr.io/netcracker/${{ matrix.component.name }}:${{ steps.tag.outputs.tag }}
          fail-build: false # or true + severity-cutoff: critical
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
